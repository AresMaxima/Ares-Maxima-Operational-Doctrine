name: Google Instant Indexing

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  index-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Google Indexing Script
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          python -c "
          import os, json, sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          key_data = os.environ.get('GCP_SERVICE_ACCOUNT_KEY')
          if not key_data:
              print('::error::Secret GCP_SERVICE_ACCOUNT_KEY manquant sur ce dépôt !')
              sys.exit(1)

          try:
              info = json.loads(key_data)
          except Exception as e:
              print('::error::Le secret JSON n\'est pas valide !')
              sys.exit(1)

          credentials = service_account.Credentials.from_service_account_info(
              info, scopes=['https://www.googleapis.com/auth/indexing']
          )
          endpoint = build('indexing', 'v3', credentials=credentials)

          urls = [
              'https://aresmaxima.com/',
              'https://aresmaxima.com/aegis-p2p/'
          ]

          for url in urls:
              body = {'url': url, 'type': 'URL_UPDATED'}
              try:
                  res = endpoint.urlNotifications().publish(body=body).execute()
                  print(f'[OK] Indexation demandée avec succès : {url}')
              except Exception as err:
                  print(f'[ERROR] Échec pour {url}: {err}')
          "
